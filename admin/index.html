<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>영빈식당 문의함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --wood: #4a2f1c;
    --barley: #d8c597;
    --namul: #4f6b3a;
    --gochu: #a8382a;
    --baekja: #fbfaf6;
    --ink: #2b231d;
    --ink-soft: #6a5f55;
    --line: #e4ddcf;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--baekja);
    color: var(--ink);
    font: 17px/1.6 "Gowun Dodum", system-ui, sans-serif;
    word-break: keep-all;
  }
  :focus-visible { outline: 3px solid var(--gochu); outline-offset: 2px; }
  header {
    background: var(--wood);
    color: var(--baekja);
    padding: 18px 16px;
  }
  header h1 { margin: 0; font: 700 22px/1.3 "Gowun Batang", serif; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }

  .login { display: grid; gap: 12px; max-width: 360px; margin: 40px auto; }
  .login label { display: grid; gap: 6px; }
  input[type="password"] {
    font: 18px/1.4 inherit;
    padding: 14px;
    border: 2px solid var(--line);
    border-radius: 10px;
    background: #fff;
  }
  input[type="password"]:focus { outline: none; border-color: var(--wood); }
  button {
    font: 700 17px/1 inherit;
    min-height: 50px;
    padding: 0 18px;
    border-radius: 10px;
    border: 2px solid var(--wood);
    background: var(--wood);
    color: var(--baekja);
    cursor: pointer;
  }
  .msg { margin: 0; min-height: 1.6em; color: var(--gochu); font-weight: 700; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .count { margin: 0; font-size: 18px; }
  .count strong { font: 700 44px/1 "Gowun Batang", serif; color: var(--gochu); margin-right: 6px; }
  .ghost { background: transparent; color: var(--wood); min-height: 44px; font-size: 15px; }

  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .item {
    background: #fff;
    border: 1px solid var(--line);
    border-left: 6px solid var(--line);
    border-radius: 10px;
    padding: 16px;
  }
  .item[data-status="새 문의"] { border-left-color: var(--gochu); }
  .item[data-status="연락함"] { border-left-color: var(--barley); }
  .item[data-status="완료"] { border-left-color: var(--namul); opacity: 0.75; }
  .meta { margin: 0 0 4px; color: var(--ink-soft); font-size: 15px; }
  .name { margin: 0; font-size: 19px; font-weight: 700; }
  .contact {
    display: inline-block;
    margin: 6px 0 10px;
    padding: 6px 10px;
    border-radius: 8px;
    background: #f1ece0;
    color: var(--ink);
    font: 17px/1.4 inherit;
    border: 0;
    min-height: 0;
  }
  .text { margin: 0 0 14px; white-space: pre-wrap; }
  .status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .status button {
    min-height: 46px;
    font-size: 16px;
    background: #fff;
    color: var(--wood);
    border-color: var(--line);
  }
  .status button[aria-pressed="true"] { background: var(--wood); color: var(--baekja); border-color: var(--wood); }
  .empty { color: var(--ink-soft); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<header><h1>영빈식당 문의함</h1></header>
<main>
  <form class="login" id="login">
    <label>관리자 비밀번호
      <input type="password" id="pw" autocomplete="current-password" required>
    </label>
    <p class="msg" id="login-msg" role="alert"></p>
    <button type="submit">문의함 열기</button>
  </form>

  <section id="box" hidden>
    <div class="top">
      <p class="count"><strong id="new-count">0</strong>건 새 문의</p>
      <button class="ghost" type="button" id="reload">새로고침</button>
    </div>
    <p class="msg" id="box-msg" role="status"></p>
    <ul class="list" id="list"></ul>
  </section>
</main>

<script>
  const STATUSES = ['새 문의', '연락함', '완료'];
  const $ = (id) => document.getElementById(id);
  const KEY = 'yb-admin-pw';
  let pw = '';
  try { pw = sessionStorage.getItem(KEY) || ''; } catch {}

  async function api(method, body) {
    const r = await fetch('/api/admin', {
      method,
      headers: { 'x-admin-password': pw, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(data.error || '불러오지 못했어요.'); e.status = r.status; throw e; }
    return data;
  }

  const fmt = (iso) => new Date(iso).toLocaleString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' });

  function render(rows) {
    $('new-count').textContent = rows.filter((r) => r.status === '새 문의').length;
    const list = $('list');
    list.textContent = '';
    if (!rows.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = '아직 들어온 문의가 없어요.';
      list.append(li);
      return;
    }
    for (const row of rows) {
      const li = document.createElement('li');
      li.className = 'item';
      li.dataset.status = row.status;

      const meta = document.createElement('p');
      meta.className = 'meta';
      meta.textContent = fmt(row.created_at);
      const name = document.createElement('p');
      name.className = 'name';
      name.textContent = row.name;
      const contact = document.createElement('button');
      contact.type = 'button';
      contact.className = 'contact';
      contact.textContent = row.contact;
      contact.title = '눌러서 복사';
      contact.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(row.contact); contact.textContent = row.contact + '  복사됨'; setTimeout(() => (contact.textContent = row.contact), 1500); }
        catch { const s = getSelection(); const rg = document.createRange(); rg.selectNodeContents(contact); s.removeAllRanges(); s.addRange(rg); }
      });
      const text = document.createElement('p');
      text.className = 'text';
      text.textContent = row.message || '(문의 내용 없음)';

      const status = document.createElement('div');
      status.className = 'status';
      for (const st of STATUSES) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = st;
        b.setAttribute('aria-pressed', String(row.status === st));
        b.addEventListener('click', async () => {
          if (row.status === st) return;
          try { await api('PATCH', { id: row.id, status: st }); load(); }
          catch (e) { $('box-msg').textContent = e.message; }
        });
        status.append(b);
      }
      li.append(meta, name, contact, text, status);
      list.append(li);
    }
  }

  async function load() {
    $('box-msg').textContent = '';
    try {
      const { rows } = await api('GET');
      $('login').hidden = true;
      $('box').hidden = false;
      render(rows);
    } catch (e) {
      if (e.status === 401) {
        pw = '';
        try { sessionStorage.removeItem(KEY); } catch {}
        $('box').hidden = true;
        $('login').hidden = false;
        $('login-msg').textContent = '비밀번호가 맞지 않아요.';
        $('pw').value = '';
        $('pw').focus();
      } else {
        $('box-msg').textContent = e.message;
        $('login-msg').textContent = e.message;
      }
    }
  }

  $('login').addEventListener('submit', (e) => {
    e.preventDefault();
    pw = $('pw').value;
    try { sessionStorage.setItem(KEY, pw); } catch {}
    $('login-msg').textContent = '';
    load();
  });
  $('reload').addEventListener('click', load);
  if (pw) load(); else $('pw').focus();
</script>
</body>
</html>
